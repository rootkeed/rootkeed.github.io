<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAILME</title>
<style>
  * { margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#000;
    color:#fff;
    font:14px monospace;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:100vh;
  }
  #state, #det, #cache { display:block; width:100%; }
</style>
</head>
<body>
<div id="state">detecting firmware...</div>
<div id="det"></div>
<div id="cache"></div>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/\s](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var supported = params.get("force") === "1" || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.textContent = "firmware: " + (key || "unknown") + (supported ? " (supported)" : " (not supported)");

    var target = "jb.html" + location.search;
    function go() { location.replace(target); }
    function waitForTap(action) {
        function fire() { window.removeEventListener("click", fire); window.removeEventListener("keydown", fire); action(); }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        stateEl.textContent = "unsupported firmware";
        waitForTap(go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        cacheEl.textContent = "offline";
        go();
    } else if (ac.status === ac.IDLE) {
        cacheEl.textContent = "cached";
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        cacheEl.textContent = "update ready";
        waitForTap(function () { location.reload(); });
    } else {
        cacheEl.textContent = "checking cache...";
        ac.addEventListener("cached", function () { cacheEl.textContent = "cached"; waitForTap(go); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} cacheEl.textContent = "update ready"; waitForTap(function () { location.reload(); }); }, false);
        ac.addEventListener("noupdate", function () { cacheEl.textContent = "cached"; go(); }, false);
        ac.addEventListener("error", function () { cacheEl.textContent = "cache error"; waitForTap(go); }, false);
    }
})();
</script>
</body>
</html>
