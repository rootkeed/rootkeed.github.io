<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAILME</title>
<style>
  * { margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:#000;
    color:#fff;
    font:16px monospace;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:100vh;
  }
  #state, #det, #cache { display:block; margin:10px; }
</style>
</head>
<body>
<div id="state">detecting firmware...</div>
<div id="det"></div>
<div id="cache"></div>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/\s](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.textContent = "firmware: " + (key || "unknown");

    if (!supported) {
        stateEl.textContent = "UNSUPPORTED";
        return;
    }

    stateEl.textContent = "supported";
    cacheEl.textContent = "launching...";
    
    setTimeout(function() {
        location.replace("jb.html" + location.search);
    }, 1000);
})();
</script>
</body>
</html>
